<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#f5efe0">
	<meta name="description" content="骰林 Dice Grove — 骰子構築 roguelike。四隻森林住民,一場十節嘅遠征。">
	<title>骰林 Dice Grove</title>
	<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }

body {
	color: #2b2b2b;
	background-color: #1b3019;
	overflow: hidden;
	touch-action: none;
	/* the game is portrait 720x1280 and drives its own layout; the canvas fills
	   the window and Godot's `expand` stretch does the rest */
	overscroll-behavior: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas { display: block; }
#canvas:focus { outline: none; }

#status {
	position: absolute; inset: 0;
	background-color: #f5efe0;
	display: flex; flex-direction: column;
	justify-content: center; align-items: center;
	font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
	visibility: hidden;
	padding: 0 2rem;
	box-sizing: border-box;
}

/* The engine's own splash <img>; the project ships with it disabled, so it is
   kept only so the exporter's classes still have somewhere to land. */
#status-splash { display: none; }

#brand {
	font-size: clamp(1.8rem, 7vw, 2.8rem);
	font-weight: 700;
	color: #2f4f2a;
	letter-spacing: 0.04em;
	margin-bottom: 0.2em;
	text-align: center;
}

#brand small {
	display: block;
	font-size: 0.42em;
	font-weight: 400;
	letter-spacing: 0.22em;
	color: #7a6a4a;
	margin-top: 0.5em;
	text-transform: uppercase;
}

#bar {
	width: min(78vw, 22rem);
	height: 10px;
	margin-top: 2.4rem;
	border-radius: 6px;
	background: #e0d5b8;
	overflow: hidden;
	box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
}

#bar > i {
	display: block;
	height: 100%;
	width: 0;
	border-radius: 6px;
	background: linear-gradient(90deg, #4f7a3a, #7aa844);
	transition: width 0.18s linear;
}

/* Indeterminate: the engine reports 0/0 until the fetch has a Content-Length,
   and a bar frozen at zero reads as a hang. */
#bar.wait > i {
	width: 35%;
	animation: sweep 1.1s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { transform: translateX(-40%); }
	to   { transform: translateX(200%); }
}

#pct {
	margin-top: 0.9rem;
	font-size: 0.85rem;
	color: #7a6a4a;
	font-variant-numeric: tabular-nums;
	min-height: 1.2em;
}

#hint {
	margin-top: 0.4rem;
	font-size: 0.72rem;
	color: #a2917080;
	text-align: center;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.4;
	margin: 1.5rem 0 0;
	padding: 1rem;
	text-align: center;
	max-width: 32rem;
	display: none;
}
	</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>需要開啟 JavaScript 先玩得到。 This game needs JavaScript.</noscript>

	<div id="status">
		<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
		<div id="brand">骰林 Dice Grove<small>Loading</small></div>
		<div id="bar" class="wait"><i></i></div>
		<div id="pct">準備緊… Preparing…</div>
		<!-- No size in this line. The counter above it reports the engine's
		     `total`, which is the UNCOMPRESSED payload (44 MB); Pages serves it
		     gzipped, so about 17 MB crosses the wire. Printing one number here
		     and a different one two lines up just reads as a bug. -->
		<div id="hint">首次載入之後會由瀏覽器快取<br>Later visits come from cache</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7011692,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const pct = document.getElementById('pct');
	const hint = document.getElementById('hint');
	const notice = document.getElementById('status-notice');
	let initializing = true;

	overlay.style.visibility = 'visible';

	function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

	function fail(err) {
		console.error(err);
		notice.textContent = (err instanceof Error) ? err.message
			: (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.style.display = 'block';
		bar.style.display = 'none';
		pct.textContent = '';
		hint.textContent = '';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		// This build is NON-THREADED on purpose (see tools/web_build.sh), so
		// SharedArrayBuffer is not among the features asked for and there is no
		// cross-origin-isolation workaround to attempt. Anything reported here
		// is a genuinely unsupported browser.
		fail('呢個瀏覽器缺少以下功能 / This browser is missing:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) {
				bar.classList.remove('wait');
				fill.style.width = (100 * current / total).toFixed(1) + '%';
				pct.textContent = Math.floor(100 * current / total) + '%  ·  '
					+ mb(current) + ' / ' + mb(total);
			} else {
				// no Content-Length yet: keep the sweep running rather than
				// showing a bar pinned at zero
				bar.classList.add('wait');
				pct.textContent = current > 0 ? mb(current) + ' 已下載 / downloaded' : '準備緊… Preparing…';
			}
		},
	}).then(function () {
		if (!initializing) { return; }
		initializing = false;
		overlay.remove();
	}, fail);
}());
	</script>
</body>
</html>
