<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="theme-color" content="#f5efe0">
	<meta name="description" content="骰林 Dice Grove — 骰子構築 roguelike。四隻森林住民,一場十節嘅遠征。">
	<title>骰林 Dice Grove</title>
	<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }

html, body { height: 100%; }

body {
	color: #2b2b2b;
	background-color: #1b3019;
	overflow: hidden;
	touch-action: none;
	/* the game is portrait 720x1280 and drives its own layout; the canvas fills
	   the VISUAL viewport (see the sizing code below) and Godot's `expand`
	   stretch does the rest */
	overscroll-behavior: none;
	-webkit-tap-highlight-color: transparent;
	position: fixed;
	inset: 0;
}

/* Pinned to the visual viewport's top-left, sized in JS. `position: fixed`
   rather than the default flow: on iOS the layout viewport is taller than the
   visual one and a static canvas ends up partly under the toolbars. */
#canvas {
	display: block;
	position: fixed;
	top: 0;
	left: 0;
}
#canvas:focus { outline: none; }

/* The only way to read `env(safe-area-inset-*)` from script: apply them as
   padding on a zero-size element and ask for the computed style. Numbers, not
   layout — nothing is ever drawn here. */
#safe-probe {
	position: fixed;
	top: 0;
	left: 0;
	width: 0;
	height: 0;
	visibility: hidden;
	pointer-events: none;
	padding-top: env(safe-area-inset-top, 0px);
	padding-right: env(safe-area-inset-right, 0px);
	padding-bottom: env(safe-area-inset-bottom, 0px);
	padding-left: env(safe-area-inset-left, 0px);
}

#status {
	position: absolute; inset: 0;
	background-color: #f5efe0;
	display: flex; flex-direction: column;
	justify-content: center; align-items: center;
	font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
	visibility: hidden;
	padding: 0 2rem;
	box-sizing: border-box;
}

/* The engine's own splash <img>; the project ships with it disabled, so it is
   kept only so the exporter's classes still have somewhere to land. */
#status-splash { display: none; }

#brand {
	font-size: clamp(1.8rem, 7vw, 2.8rem);
	font-weight: 700;
	color: #2f4f2a;
	letter-spacing: 0.04em;
	margin-bottom: 0.2em;
	text-align: center;
}

#brand small {
	display: block;
	font-size: 0.42em;
	font-weight: 400;
	letter-spacing: 0.22em;
	color: #7a6a4a;
	margin-top: 0.5em;
	text-transform: uppercase;
}

#bar {
	width: min(78vw, 22rem);
	height: 10px;
	margin-top: 2.4rem;
	border-radius: 6px;
	background: #e0d5b8;
	overflow: hidden;
	box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.16);
}

#bar > i {
	display: block;
	height: 100%;
	width: 0;
	border-radius: 6px;
	background: linear-gradient(90deg, #4f7a3a, #7aa844);
	transition: width 0.18s linear;
}

/* Indeterminate: the engine reports 0/0 until the fetch has a Content-Length,
   and a bar frozen at zero reads as a hang. */
#bar.wait > i {
	width: 35%;
	animation: sweep 1.1s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { transform: translateX(-40%); }
	to   { transform: translateX(200%); }
}

#pct {
	margin-top: 0.9rem;
	font-size: 0.85rem;
	color: #7a6a4a;
	font-variant-numeric: tabular-nums;
	min-height: 1.2em;
}

#hint {
	margin-top: 0.4rem;
	font-size: 0.72rem;
	color: #a2917080;
	text-align: center;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	line-height: 1.4;
	margin: 1.5rem 0 0;
	padding: 1rem;
	text-align: center;
	max-width: 32rem;
	display: none;
}
	</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<div id="safe-probe"></div>
	<noscript>需要開啟 JavaScript 先玩得到。 This game needs JavaScript.</noscript>

	<div id="status">
		<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
		<div id="brand">骰林 Dice Grove<small>Loading</small></div>
		<div id="bar" class="wait"><i></i></div>
		<div id="pct">準備緊… Preparing…</div>
		<!-- No size in this line. The counter above it reports the engine's
		     `total`, which is the UNCOMPRESSED payload (44 MB); Pages serves it
		     gzipped, so about 17 MB crosses the wire. Printing one number here
		     and a different one two lines up just reads as a bug. -->
		<div id="hint">首次載入之後會由瀏覽器快取<br>Later visits come from cache</div>
		<div id="status-notice"></div>
	</div>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7539524,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

/* ── the canvas is sized here, not by the engine ──────────────────────────
 *
 * The exporter's default is `canvasResizePolicy: 2`, which sets the canvas to
 * `window.innerWidth x window.innerHeight`. On a phone browser that is the
 * WRONG height twice over:
 *
 *   · `innerHeight` reports the LARGE viewport — the height the page gets once
 *     the address bar has retracted — so before you scroll (and this game never
 *     scrolls) the canvas is taller than the strip you can actually see. The
 *     overflow goes off the bottom, the address bar covers the top, and the
 *     game's top bar — turn counter, Essence meter, reroll count — is simply
 *     not on screen. That is the bug this file exists to fix.
 *   · it ignores `visualViewport` entirely, so nothing happens when the address
 *     bar slides in or out mid-play.
 *
 * `visualViewport` is the API that answers "what is on the glass right now",
 * and it fires `resize` for exactly the events that used to go unnoticed. So:
 * policy 0 (the engine reads the canvas's own width/height and leaves them
 * alone), and `fit()` below owns them.
 *
 * The safe-area insets are published rather than applied. Applying them here
 * would mean insetting the canvas, i.e. two black bars — the notch strip is
 * worth having the forest background run into. `SafeArea` (autoload `Safe`)
 * picks these up and the SCREENS inset their own HUDs instead.
 */
GODOT_CONFIG['canvasResizePolicy'] = 0;

(function () {
	const canvas = document.getElementById('canvas');
	const probe = document.getElementById('safe-probe');
	const px = (v) => parseFloat(v) || 0;

	function fit() {
		const vv = window.visualViewport;
		// `Math.round`, not `floor`: flooring both axes every address-bar frame
		// makes the canvas jitter by a pixel, which on a stretched viewport is a
		// visible shimmer along the whole UI.
		const w = Math.round(vv ? vv.width : window.innerWidth);
		const h = Math.round(vv ? vv.height : window.innerHeight);
		if (w < 1 || h < 1) { return; }
		const dpr = window.devicePixelRatio || 1;
		const bw = Math.round(w * dpr);
		const bh = Math.round(h * dpr);
		if (canvas.style.width !== w + 'px') { canvas.style.width = w + 'px'; }
		if (canvas.style.height !== h + 'px') { canvas.style.height = h + 'px'; }
		// The engine watches these two attributes under policy 0 and re-reports
		// the window size to Godot when they change; assigning an unchanged value
		// still reallocates the drawing buffer, so both are guarded.
		if (canvas.width !== bw) { canvas.width = bw; }
		if (canvas.height !== bh) { canvas.height = bh; }
		const cs = getComputedStyle(probe);
		window.__dgViewport = {
			w: w, h: h, dpr: dpr,
			top: px(cs.paddingTop), right: px(cs.paddingRight),
			bottom: px(cs.paddingBottom), left: px(cs.paddingLeft),
		};
	}

	fit();
	window.addEventListener('resize', fit);
	window.addEventListener('orientationchange', fit);
	if (window.visualViewport) {
		// `scroll` as well as `resize`: on iOS the address bar collapsing is
		// reported as a scroll of the visual viewport, not as a resize of it.
		window.visualViewport.addEventListener('resize', fit);
		window.visualViewport.addEventListener('scroll', fit);
	}
	// Rotating a phone lands the new metrics one frame after the event on every
	// browser measured, so the handlers above are re-run on the next two frames.
	window.addEventListener('orientationchange', function () {
		requestAnimationFrame(fit);
		requestAnimationFrame(function () { requestAnimationFrame(fit); });
	});
}());

const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = bar.firstElementChild;
	const pct = document.getElementById('pct');
	const hint = document.getElementById('hint');
	const notice = document.getElementById('status-notice');
	let initializing = true;

	overlay.style.visibility = 'visible';

	function mb(n) { return (n / 1048576).toFixed(1) + ' MB'; }

	function fail(err) {
		console.error(err);
		notice.textContent = (err instanceof Error) ? err.message
			: (typeof err === 'string' ? err : 'An unknown error occurred.');
		notice.style.display = 'block';
		bar.style.display = 'none';
		pct.textContent = '';
		hint.textContent = '';
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		// This build is NON-THREADED on purpose (see tools/web_build.sh), so
		// SharedArrayBuffer is not among the features asked for and there is no
		// cross-origin-isolation workaround to attempt. Anything reported here
		// is a genuinely unsupported browser.
		fail('呢個瀏覽器缺少以下功能 / This browser is missing:\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		onProgress: function (current, total) {
			if (total > 0) {
				bar.classList.remove('wait');
				fill.style.width = (100 * current / total).toFixed(1) + '%';
				pct.textContent = Math.floor(100 * current / total) + '%  ·  '
					+ mb(current) + ' / ' + mb(total);
			} else {
				// no Content-Length yet: keep the sweep running rather than
				// showing a bar pinned at zero
				bar.classList.add('wait');
				pct.textContent = current > 0 ? mb(current) + ' 已下載 / downloaded' : '準備緊… Preparing…';
			}
		},
	}).then(function () {
		if (!initializing) { return; }
		initializing = false;
		overlay.remove();
	}, fail);
}());
	</script>
</body>
</html>
